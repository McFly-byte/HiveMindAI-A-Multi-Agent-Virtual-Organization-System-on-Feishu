[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemindai"
version = "0.1.0"
description = "HiveMindAI 鈥?Feishu Base PMO multi-agent MVP (runtime + tool integration)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "lark-oapi>=1.4.0",
    "python-socks[asyncio]>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
memory = ["mem0ai>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src", "src/agent-hive"]

[tool.setuptools.package-data]
"agent_hive.memory.runtime_compat" = ["schema.sql"]
