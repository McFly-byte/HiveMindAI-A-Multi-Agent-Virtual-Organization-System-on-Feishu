[project]
name = "tool-agent-harness"
version = "0.1.0"
description = "A lightweight tool testing agent harness with Rich CLI, dotenv, event bus, metatools, and switchable jobs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "lark-oapi>=1.4.0",
  "textual>=0.66.0",
]

[project.scripts]
tooltest = "tooltest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tooltest"]
