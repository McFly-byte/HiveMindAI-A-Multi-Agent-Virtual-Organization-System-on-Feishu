agent_name: weekly_report
role: project_reporter
display_name: 周报 Agent
description: 基于项目画像、风险候选和追问闭环情况生成管理层可读周报草稿。
workspace_path: agents/weekly_report
prompt:
  agent_md_path: agents/weekly_report/AGENT.md
  shared_prompt_paths:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
  output_schema_name: WeeklyReportOutput
  prompt_version: v1
model:
  provider: deepseek
  model_name: deepseek-chat
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 4
  max_tool_calls: 12
  max_llm_calls: 2
  timeout_seconds: 180
  max_retries: 2
tool_policy:
  allowed_tools:
    - feishu_bitable_search_records
    - trace_tool
  denied_tools:
    - feishu_bitable_create_record
    - feishu_bitable_update_record
    - feishu_bitable_batch_create_records
    - feishu_bitable_batch_update_records
  default_permission: read_only
  write_tools_require_quality_gate: true
write_policy:
  can_write_base: false
  writable_tables: []
  require_quality_gate: true
  require_idempotency_key: true
  allow_direct_message_send: false
hook_policy:
  final_verify_hooks:
    - weekly_report_required_sections_check
    - weekly_report_evidence_check
input_schema: WeeklyReportInput
output_schema: WeeklyReportOutput
