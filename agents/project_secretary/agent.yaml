agent_name: project_secretary
role: project_data_secretary
display_name: 项目秘书 Agent
description: 只读巡检项目、任务、里程碑，输出项目画像、缺失字段和异常信号。
workspace_path: agents/project_secretary
prompt:
  agent_md_path: agents/project_secretary/AGENT.md
  shared_prompt_paths:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
  output_schema_name: ProjectStateOutput
  prompt_version: v1
model:
  provider: deepseek
  model_name: deepseek-chat
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 4
  max_tool_calls: 16
  max_llm_calls: 2
  timeout_seconds: 150
  max_retries: 2
tool_policy:
  allowed_tools:
    - feishu_bitable_search_records
    - trace_tool
  denied_tools:
    - feishu_bitable_create_record
    - feishu_bitable_update_record
    - feishu_bitable_batch_create_records
    - feishu_bitable_batch_update_records
  default_permission: read_only
  write_tools_require_quality_gate: true
write_policy:
  can_write_base: false
  writable_tables: []
  require_quality_gate: true
  require_idempotency_key: true
  allow_direct_message_send: false
hook_policy:
  final_verify_hooks:
    - project_state_schema_check
    - evidence_check
input_schema: ProjectStateInput
output_schema: ProjectStateOutput
