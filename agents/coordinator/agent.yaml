agent_name: coordinator
role: orchestrator
display_name: PMO Coordinator Agent
description: 系统内部主控 Agent，负责触发事件识别、子 Agent 调度、结果汇总、Quality Gate 和写回决策。
workspace_path: agents/coordinator
prompt:
  agent_md_path: agents/coordinator/AGENT.md
  shared_prompt_paths:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
  output_schema_name: CoordinatorPlan
  prompt_version: v1
model:
  provider: deepseek
  model_name: deepseek-chat
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 5
  max_tool_calls: 20
  max_llm_calls: 3
  timeout_seconds: 180
  max_retries: 2
tool_policy:
  allowed_tools:
    - feishu_bitable_search_records
    - feishu_bitable_create_record
    - feishu_bitable_update_record
    - trace_tool
    - memory_search
    - memory_write
    - memory_reflect
    - memory_weight_update
    - memory_evict
    - doc_ingest
    - doc_search
    - project_context_get
    - project_context_upsert
    - process_log
    - process_search
    - profile_read
    - profile_write
  denied_tools: []
  default_permission: write_with_gate
  write_tools_require_quality_gate: true
write_policy:
  can_write_base: true
  writable_tables:
    - Risks
    - FollowUps
    - WeeklyReports
    - AgentRuns
    - Projects
    - Tasks
    - Milestones
  require_quality_gate: true
  require_idempotency_key: true
  allow_direct_message_send: false
hook_policy:
  pre_act_hooks: []
  post_act_hooks: []
  pre_write_hooks:
    - quality_gate
    - idempotency_check
    - field_mapping_check
  post_write_hooks:
    - writeback_verify
  final_verify_hooks:
    - agent_run_log_check
input_schema: AgentTriggerEvent
output_schema: CoordinatorPlan
