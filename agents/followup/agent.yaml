agent_name: followup
role: info_followup_specialist
display_name: 追问 Agent
description: 根据缺失信息、待确认风险和阻塞项生成具体追问内容；MVP 阶段只输出追问创建建议。
workspace_path: agents/followup
prompt:
  agent_md_path: agents/followup/AGENT.md
  shared_prompt_paths:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
  output_schema_name: FollowUpOutput
  prompt_version: v1
model:
  provider: deepseek
  model_name: deepseek-chat
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 4
  max_tool_calls: 12
  max_llm_calls: 2
  timeout_seconds: 150
  max_retries: 2
tool_policy:
  allowed_tools:
    - feishu_bitable_search_records
    - trace_tool
  denied_tools:
    - feishu_im_reply_text
    - feishu_bitable_create_record
    - feishu_bitable_update_record
    - feishu_bitable_batch_create_records
    - feishu_bitable_batch_update_records
  default_permission: read_only
  write_tools_require_quality_gate: true
write_policy:
  can_write_base: false
  writable_tables: []
  require_quality_gate: true
  require_idempotency_key: true
  allow_direct_message_send: false
hook_policy:
  final_verify_hooks:
    - followup_target_check
    - followup_question_specificity_check
input_schema: FollowUpInput
output_schema: FollowUpOutput
