agent_id: project_retrospective
role: business_agent
entrypoint: llm_agent
display_name: 复盘 Agent
description: FR-08 项目复盘与经验沉淀；汇总延期、变更、返工与风险滞后点，输出复盘报告与治理建议；Feishu 操作必须委托。
workspace_path: agents/project_retrospective
prompt:
  system: AGENT.md
  shared:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 5
  max_child_runs: 4
  timeout_seconds: 240
  max_retries: 2
memory:
  enabled: true
  namespace: self
  read_scopes: [self, project]
  write_types: [episodic, reflective]
  max_search_results: 8
  auto_write_run_summary: true
tool_access:
  direct_toolsets: [memory]
  direct_tools:
    - memory.search
    - memory.write
    - memory.reflect
  denied_tools:
    - feishu.*
  delegated_toolsets:
    feishu: feishu_tool_agent
orchestration:
  subscribes:
    - project.retrospective.requested
    - project.lifecycle.completed
  emits:
    - retrospective.completed
  priority: 15
  max_parallel_runs: 1
input_schema: ProjectRetrospectiveInput
output_schema: ProjectRetrospectiveOutput
