agent_id: risk_analysis
role: business_agent
entrypoint: llm_agent
display_name: 风险识别 Agent
description: 基于项目画像、异常信号、历史风险和追问状态生成风险候选；Feishu 操作必须委托。
workspace_path: agents/risk_analysis
prompt:
  system: AGENT.md
  shared:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.15
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 5
  max_child_runs: 4
  timeout_seconds: 180
  max_retries: 2
memory:
  enabled: true
  namespace: self
  read_scopes: [self, project]
  write_types: [episodic, reflective]
  max_search_results: 8
  auto_write_run_summary: true
tool_access:
  direct_toolsets: [memory]
  direct_tools:
    - memory.search
    - memory.write
    - memory.reflect
  denied_tools:
    - feishu.*
  delegated_toolsets:
    feishu: feishu_tool_agent
orchestration:
  subscribes:
    - project.state.checked
  emits:
    - risk.analysis.completed
  priority: 40
  max_parallel_runs: 1
input_schema: RiskAnalysisInput
output_schema: RiskAnalysisOutput
