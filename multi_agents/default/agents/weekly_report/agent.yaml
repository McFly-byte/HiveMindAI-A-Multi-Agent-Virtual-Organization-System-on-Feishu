agent_id: weekly_report
role: business_agent
entrypoint: llm_agent
display_name: 周报 Agent
description: 基于项目画像、风险候选和追问闭环情况生成管理层可读周报草稿；Feishu 操作必须委托。
workspace_path: agents/weekly_report
prompt:
  system: AGENT.md
  shared:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 4
  max_child_runs: 4
  timeout_seconds: 180
  max_retries: 2
memory:
  enabled: true
  namespace: self
  read_scopes: [self, project]
  write_types: [episodic, reflective]
  max_search_results: 8
  auto_write_run_summary: true
tool_access:
  direct_toolsets: [memory]
  direct_tools:
    - memory.search
    - memory.write
    - memory.reflect
  denied_tools:
    - feishu.*
  delegated_toolsets:
    feishu: feishu_tool_agent
orchestration:
  subscribes:
    - followup.generated
    - resource.coordination.completed
    - weekly_report.requested
  emits:
    - weekly_report.generated
  priority: 20
  max_parallel_runs: 1
input_schema: WeeklyReportInput
output_schema: WeeklyReportOutput
