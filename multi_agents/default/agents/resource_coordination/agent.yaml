agent_id: resource_coordination
role: business_agent
entrypoint: llm_agent
display_name: 资源协调 Agent
description: FR-05 风险处置与资源协调；基于项目优先级、负责人负载与风险列表输出调整/升级建议；Feishu 操作必须委托。
workspace_path: agents/resource_coordination
prompt:
  system: AGENT.md
  shared:
    - prompts/shared/output_rules.md
    - prompts/shared/evidence_rules.md
    - prompts/shared/no_hallucination_rules.md
model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.15
  max_tokens: 4096
  timeout_seconds: 60
  json_mode: true
runtime_limits:
  max_steps: 5
  max_child_runs: 4
  timeout_seconds: 180
  max_retries: 2
memory:
  enabled: true
  namespace: self
  read_scopes: [self, project]
  write_types: [episodic, reflective]
  max_search_results: 8
  auto_write_run_summary: true
tool_access:
  direct_toolsets: [memory]
  direct_tools:
    - memory.search
    - memory.write
    - memory.reflect
  denied_tools:
    - feishu.*
  delegated_toolsets:
    feishu: feishu_tool_agent
orchestration:
  subscribes:
    - followup.generated
    - resource.coordination.requested
  emits:
    - resource.coordination.completed
  priority: 26
  max_parallel_runs: 1
input_schema: ResourceCoordinationInput
output_schema: ResourceCoordinationOutput
